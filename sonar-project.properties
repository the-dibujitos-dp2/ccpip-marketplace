# CCPIP-23: analisis en SonarQube Cloud (un solo proyecto para el monorepo).
# Reemplaza organization y projectKey por los que muestre SonarQube Cloud al importar el repo.
sonar.organization=the-dibujitos-dp2
sonar.projectKey=the-dibujitos-dp2_ccpip-marketplace
sonar.projectName=CCPIP Marketplace

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
# Las pruebas del frontend viven junto al codigo: se separan por nombre
sonar.exclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**
sonar.sourceEncoding=UTF-8

sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Punto de entrada que solo monta React: no tiene logica que probar
sonar.coverage.exclusions=frontend/src/main.jsx

# El pipeline espera el resultado del Quality Gate y falla si no pasa
sonar.qualitygate.wait=true
