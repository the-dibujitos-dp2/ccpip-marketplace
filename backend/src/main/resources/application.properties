spring.application.name=ccpip-marketplace-backend

# CCPIP-27: inicio y cierre de sesion
ccpip.auth.max-failed-attempts=5
ccpip.auth.lock-duration=15m
ccpip.auth.session-timeout=30m
# Cookie de sesion solo por HTTPS. localhost cuenta como seguro en los navegadores, asi que
# tambien funciona en desarrollo con Vite.
ccpip.auth.cookie-secure=true

# CCPIP-26 y CCPIP-328: enlace de verificacion del correo
ccpip.auth.enlace-verificacion-vigencia=24h
# CCPIP-33: el enlace para restablecer la contrasena vence antes que el de verificacion
ccpip.auth.enlace-recuperacion-vigencia=30m
# CCPIP-301 y CCPIP-304: el enlace de bienvenida de una cuenta creada por la Camara, para elegir la contrasena
ccpip.cuentas.enlace-acceso-vigencia=72h
# Tiempo minimo entre dos reenvios del enlace a la misma cuenta
ccpip.auth.enlace-reenvio-espera=60s
# Direccion publica del frontend, para armar el enlace del correo. En desarrollo, Vite.
ccpip.app.url=${CCPIP_APP_URL:http://localhost:5173}

# Correo por SMTP (ADR-14). En desarrollo, Mailpit de docker compose (bandeja en http://localhost:8025).
# Sin host, los correos quedan en el registro de la aplicacion en vez de enviarse.
ccpip.correo.host=${CCPIP_CORREO_HOST:localhost}
ccpip.correo.puerto=${CCPIP_CORREO_PUERTO:1025}
ccpip.correo.usuario=${CCPIP_CORREO_USUARIO:}
ccpip.correo.clave=${CCPIP_CORREO_CLAVE:}
ccpip.correo.starttls=${CCPIP_CORREO_STARTTLS:false}
ccpip.correo.remitente=${CCPIP_CORREO_REMITENTE:Mercado CCPIP <no-responder@ccpip.test>}
ccpip.correo.mostrar-en-registro=true

# CCPIP-142 (RF-109): vigencia del carrito desde su ultimo cambio, independiente de la sesion.
# PROVISIONAL: rige solo mientras el superadministrador no la configure en SA-02 (tabla
# parametro_plataforma). 2h es el valor de ejemplo del Figma SA-02 "Vida del carrito sin pagar"; la
# Camara aun no lo define ("Pendiente de definicion del stakeholder", CHANGELOG del Figma). En horas enteras.
ccpip.carrito.vigencia-provisional=2h
# Cada cuanto se vacian los carritos vencidos que nadie volvio a abrir
ccpip.carrito.barrido-vencidos=PT15M

# CCPIP-148: base de datos. Por defecto apunta a la de desarrollo (docker compose up -d).
# En prod las variables SPRING_DATASOURCE_* las pone deploy/docker-compose.yml.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/ccpip_dev
spring.datasource.username=ccpip
spring.datasource.password=ccpip
# El esquema lo manda Flyway, nunca Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# db/seed trae las cuentas por rol y los productos de demostracion (CCPIP-150).
# Corre en todos los ambientes; para un ambiente sin demo basta quitar db/seed aqui.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# CCPIP-30 y CCPIP-44: imagenes en S3. En el ambiente desplegado el bucket lo crea Terraform y
# las credenciales salen del perfil de la EC2. En desarrollo, S3Mock (docker compose up -d).
ccpip.imagenes.bucket=${CCPIP_IMAGENES_BUCKET:ccpip-imagenes-dev}
ccpip.imagenes.endpoint=${CCPIP_IMAGENES_ENDPOINT:http://localhost:9090}
ccpip.imagenes.crear-bucket=${CCPIP_IMAGENES_CREAR_BUCKET:true}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Redaccion asistida (CCPIP-48): "ninguno" hasta integrar el modelo real; "simulado" solo en pruebas.
ccpip.ia.proveedor=${CCPIP_IA_PROVEEDOR:ninguno}

# Traduccion automatica (CCPIP-147): "ninguno" mientras el cliente no apruebe una estrategia (responde
# 503 y se conserva el original); "simulado" solo en pruebas. No se impone ningun proveedor real.
ccpip.traduccion.proveedor=${CCPIP_TRADUCCION_PROVEEDOR:ninguno}
# IA de imagenes (CCPIP-144 validar, CCPIP-176 mejorar): "ninguno" (503, se sigue con la foto
# original) o "simulado" (pruebas y demo, no es IA real). El modelo definitivo se agregara como otro valor.
ccpip.ia.imagenes.proveedor=${CCPIP_IA_IMAGENES_PROVEEDOR:${ccpip.ia.proveedor}}

# CCPIP-82 (RF-89): calificaciones necesarias para publicar el promedio de una oferta. Provisional: rige
# mientras el superadministrador no fije el parametro de SA-02 (parametro_plataforma); con menos, la ficha
# no muestra promedio.
ccpip.calificaciones.minimo-para-promedio=${CCPIP_CALIFICACIONES_MINIMO:3}

# CCPIP-273: cada cuanto se revisa si una oferta con interesados vuelve a venderse para avisarles.
ccpip.intereses.revision=${CCPIP_INTERESES_REVISION:PT5M}
ccpip.intereses.revision-inicial=PT1M

# CCPIP-79, 145 y 337 (PW-21, A-08): anticipacion de vencimiento y dias sin salidas de un lote
# estancado. PROVISIONALES: rigen hasta que cada productor o punto guarde los suyos en "Configurar
# alertas". 15 es el valor de ejemplo del Figma (PW-21, A-08); 30 lo acordo el equipo para estancados.
ccpip.alertas.dias-vencimiento-provisional=15
ccpip.alertas.dias-estancado-provisional=30
# Cada cuanto se revisan las alertas y que tan atras se buscan los eventos (transferencias, pedidos)
ccpip.alertas.revision=${CCPIP_ALERTAS_REVISION:PT15M}
ccpip.alertas.revision-inicial=PT2M
ccpip.alertas.ventana-eventos=P2D
