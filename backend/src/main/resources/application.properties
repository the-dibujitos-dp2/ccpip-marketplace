spring.application.name=ccpip-marketplace-backend

# CCPIP-27: inicio y cierre de sesion
ccpip.auth.max-failed-attempts=5
ccpip.auth.lock-duration=15m
ccpip.auth.session-timeout=30m

# CCPIP-148: base de datos. Por defecto apunta a la de desarrollo (docker compose up -d).
# En prod las variables SPRING_DATASOURCE_* las pone deploy/docker-compose.yml.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/ccpip_dev
spring.datasource.username=ccpip
spring.datasource.password=ccpip
# El esquema lo manda Flyway, nunca Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# db/seed trae las cuentas por rol y los productos de demostracion (CCPIP-150).
# Corre en todos los ambientes; para un ambiente sin demo basta quitar db/seed aqui.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
