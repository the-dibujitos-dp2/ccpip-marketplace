# CCPIP-23: perfil del ambiente desplegado (SPRING_PROFILES_ACTIVE=prod).
# Las credenciales llegan por variables de entorno desde deploy/.env, nunca se escriben aqui.

# Detras de Caddy: respetar X-Forwarded-* para IP real y esquema https
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never

# Solo health, y sin detalles hacia afuera. Caddy no expone /actuator.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Imagenes: bucket real de S3 (Terraform), sin endpoint propio y sin crear buckets
ccpip.imagenes.bucket=${CCPIP_IMAGENES_BUCKET}
ccpip.imagenes.endpoint=
ccpip.imagenes.crear-bucket=false

# CCPIP-26 y CCPIP-328: enlace del correo hacia el dominio publico (deploy/docker-compose.yml)
ccpip.app.url=${CCPIP_APP_URL}

# Correo con Gmail por SMTP y contrasena de aplicacion (ADR-14). Los secretos CORREO_USUARIO y
# CORREO_CLAVE del repositorio llegan por deploy/.env. Sin ellos el host queda vacio: la aplicacion
# arranca, pero los correos no salen y el registro solo deja un aviso, nunca el enlace.
ccpip.correo.host=${CCPIP_CORREO_HOST:}
ccpip.correo.puerto=${CCPIP_CORREO_PUERTO:587}
ccpip.correo.usuario=${CCPIP_CORREO_USUARIO:}
ccpip.correo.clave=${CCPIP_CORREO_CLAVE:}
ccpip.correo.starttls=${CCPIP_CORREO_STARTTLS:true}
ccpip.correo.remitente=${CCPIP_CORREO_REMITENTE:}
ccpip.correo.mostrar-en-registro=false
