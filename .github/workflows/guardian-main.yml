# CCPIP-22 (RF-101, RNF-26): guardian de main.
#
# El plan gratuito de GitHub no permite proteger ramas de un repo privado: nada impide fusionar un
# PR con checks en rojo. Este workflow corre al fusionar un PR a main, comprueba que cumplia los
# checks obligatorios de docs/ruleset-main.json y, si no, avisa (modo "avisar") o ademas revierte el
# merge y pide redesplegar main (modo "revertir"). Se elige con la variable del repo GUARDIAN_MODO:
# avisar (por defecto), revertir o apagado. Cuando el repo pueda aplicar ese ruleset de verdad, este workflow sobra.
# Detalle, limites y pruebas: docs/devsecops.md ("Guardian de main").
name: Guardian de main

on:
  # pull_request_target usa la version de este archivo que ya esta en main: un PR no puede cambiarlo
  # para saltarse el guardian. El workflow nunca descarga ni ejecuta el codigo del PR.
  pull_request_target:
    types: [closed]
    branches: [main]
  # Simulacro manual, solo sobre ramas prueba/* (nunca main)
  workflow_dispatch:
    inputs:
      rama:
        description: "Rama prueba/* sobre la que simular (nunca main)"
        required: true
        default: prueba/guardian
      modo:
        description: "avisar solo comenta; revertir tambien revierte la rama de prueba"
        type: choice
        options: [avisar, revertir]
        default: avisar
      checks_fallidos:
        description: "Checks que se fingen incumplidos, separados por coma"
        required: true
        default: "Backend (tests)"

permissions: {}

# Uno a la vez: dos merges seguidos no se pisan al revertir
concurrency:
  group: guardian-main
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar los checks del PR fusionado
    # Solo PRs realmente fusionados; el simulacro, solo sobre prueba/*
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.rama, 'prueba/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # solo para el revert y su etiqueta de respaldo
      pull-requests: write # comentar el PR
      issues: write # abrir el issue y crear la etiqueta forzar-merge
      checks: read # leer los checks del PR
      actions: write # pedir el redespliegue de main tras un revert (deploy.yml admite workflow_dispatch)
    steps:
      # Siempre la rama por defecto (main): de ahi salen el script y el ruleset
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Todo dato del evento entra por variables de entorno, nunca dentro del script de shell
      - name: Guardian
        env:
          GH_TOKEN: ${{ github.token }}
          GUARDIAN_MODO: ${{ github.event_name == 'workflow_dispatch' && inputs.modo || vars.GUARDIAN_MODO }}
          RAMA: ${{ github.event_name == 'workflow_dispatch' && inputs.rama || github.event.pull_request.base.ref }}
          SIMULACRO: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          CHECKS_FALLIDOS: ${{ inputs.checks_fallidos }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          ETIQUETAS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash .github/guardian/guardian-main.sh
