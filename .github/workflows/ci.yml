# CCPIP-23: puerta de calidad y seguridad. Corre en cada PR hacia main y antes de cada despliegue.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  schedule:
    # Lunes 07:00 (Lima): detecta CVEs nuevos aunque nadie haya tocado el codigo
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests + SonarQube)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube necesita el historial para el analisis de codigo nuevo

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar, probar y medir cobertura
        working-directory: backend
        run: ./mvnw -B verify

      - name: Analisis SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  frontend:
    name: Frontend (build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - name: Dependencias vulnerables (produccion)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secretos filtrados (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          extra_args: --results=verified,unknown

  trivy:
    name: Dependencias, Dockerfiles y Terraform (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
