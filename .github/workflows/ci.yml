# CCPIP-23: puerta de calidad y seguridad. Corre en cada PR hacia main y antes de cada despliegue.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
  schedule:
    # Lunes 07:00 (Lima): detecta CVEs nuevos aunque nadie haya tocado el codigo
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar, probar y medir cobertura
        working-directory: backend
        run: |
          set -o pipefail
          ./mvnw -B verify 2>&1 | tee maven.log

      # Deja en el PR, como anotaciones, que prueba fallo o que no compilo, sin tener que abrir el log
      - name: Resumen de fallas del backend
        if: failure()
        working-directory: backend
        run: |
          grep -E '^\[ERROR\] /.*\.java:\[' maven.log | head -10 | sed -E 's#^\[ERROR\] .*/(src/[^:]+):\[([0-9]+),[0-9]+\] (.*)#::error file=backend/\1,line=\2::\3#' || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob("target/surefire-reports/TEST-*.xml"):
              for caso in ET.parse(f).getroot().iter("testcase"):
                  for falla in list(caso.findall("failure")) + list(caso.findall("error")):
                      if n < 10:
                          msg = " ".join((falla.get("message") or falla.text or "").split())[:400]
                          print(f"::error title={caso.get('classname').split('.')[-1]}.{caso.get('name')}::{msg}")
                      n += 1
          print(f"{n} pruebas con falla")
          PY

      # El escaneo del pom.xml no ve las versiones que hereda de Spring Boot; el jar si
      - name: CVEs en el jar empaquetado (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: backend/target
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-analisis
          path: |
            backend/target/classes
            backend/target/test-classes
            backend/target/site/jacoco/jacoco.xml
          retention-days: 1

  frontend:
    name: Frontend (tests + build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Pruebas con cobertura
        run: npm run test:coverage
      - run: npm run build
      - name: Dependencias vulnerables (produccion)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-cobertura
          path: frontend/coverage/lcov.info
          retention-days: 1

  sonar:
    name: SonarQube (Quality Gate)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarQube necesita el historial para el analisis de codigo nuevo
      # Clases y cobertura de JaCoCo (backend) y lcov de Vitest (frontend), en sus rutas originales
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-analisis
          path: backend/target
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-cobertura
          path: frontend/coverage
      - name: Analisis SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0

  e2e:
    name: Punta a punta (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci
      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      # Mismas imagenes que van a produccion (backend con perfil prod, Caddy con su CSP)
      - name: Levantar el stack de pruebas
        run: docker compose up -d --build --wait

      - name: Flujo productor-consumidor, sesion, accesibilidad y celular
        run: npx playwright test

      - name: Logs del stack si algo fallo
        if: failure()
        run: docker compose logs --no-color > stack.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-reporte
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/stack.log
          retention-days: 7
          if-no-files-found: ignore

  secrets:
    name: Secretos filtrados (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Sin el detector JDBC: marca cualquier URL jdbc: (incluso sin clave) y en .properties no
      # se puede poner "trufflehog:ignore" en la misma linea. Las claves fijas en el codigo
      # las sigue detectando SonarQube (regla S2068) y las reales viven en secretos de GitHub.
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --results=verified,unknown --exclude-detectors=JDBC

  trivy:
    name: Dependencias, Dockerfiles y Terraform (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
