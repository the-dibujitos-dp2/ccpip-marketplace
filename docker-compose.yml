# Servicios de DESARROLLO local (separados de los del ambiente desplegado).
#   docker compose up -d
# - Base de datos: jdbc:postgresql://localhost:5432/ccpip_dev, usuario/clave ccpip/ccpip
# - Imagenes: S3Mock en http://localhost:9090 (el backend crea el bucket al arrancar)
# - Correo: Mailpit recibe todo lo que envia el backend; bandeja en http://localhost:8025 (CCPIP-328)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ccpip_dev
      POSTGRES_USER: ccpip
      POSTGRES_PASSWORD: ccpip
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  s3:
    image: adobe/s3mock:5.2.3
    ports:
      - "127.0.0.1:9090:9090"

  correo:
    image: axllent/mailpit:v1.30.7
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata-dev:
